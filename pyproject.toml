[project]
name = "familyocr"
version = "0.1.0"
description = "Chinese genealogy OCR and structured digitization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pikepdf>=9.0",
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.0",
    "glymur>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
familyocr = "familyocr.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familyocr"]
artifacts = ["src/familyocr/review/app.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
