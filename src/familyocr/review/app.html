<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>familyocr review</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --line: #2b3038; --text: #e6e8ec;
    --muted: #8c94a3; --accent: #6ea8fe; --warn: #f0b429; --ok: #4ec9a0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Helvetica Neue", sans-serif; }
  header { display: flex; gap: 16px; align-items: center; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line);
           position: sticky; top: 0; z-index: 10; }
  header b { font-size: 15px; }
  .muted { color: var(--muted); }
  .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; }
  .bar > div { height: 100%; background: var(--ok); border-radius: 3px; width: 0; }
  main { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px 16px 80px; }
  .band { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .band > h2 { margin: 0; padding: 6px 12px; background: var(--panel);
               font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  .rows { display: flex; flex-direction: column; }
  .row { display: grid; grid-template-columns: 62px 108px 1fr 150px;
         gap: 12px; align-items: center; padding: 8px 12px;
         border-top: 1px solid var(--line); }
  .row.sel { background: #232733; }
  .row.flagged { border-left: 3px solid var(--warn); }
  .row.done { border-left: 3px solid var(--ok); }
  .idx { color: var(--muted); font-variant-numeric: tabular-nums; }
  .crop { background: #fff; border-radius: 4px; height: 104px;
          display: flex; align-items: center; justify-content: center; }
  .crop img { max-height: 104px; max-width: 104px; object-fit: contain; }
  input[type=text] { width: 100%; padding: 8px 10px; font-size: 19px;
                     background: #0f1115; color: var(--text);
                     border: 1px solid var(--line); border-radius: 6px; }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  input.changed { border-color: var(--warn); }
  .meta { font-size: 12px; color: var(--muted); }
  .meta .kind { color: var(--warn); }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 8px 16px;
           background: var(--panel); border-top: 1px solid var(--line);
           font-size: 12px; color: var(--muted); display: flex; gap: 18px; }
  kbd { background: #0f1115; border: 1px solid var(--line); border-radius: 4px;
        padding: 1px 5px; font-size: 11px; color: var(--text); }
  button { background: #262b34; color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <b id="doc">familyocr</b>
  <button onclick="go(-1)">◀</button>
  <span>page <b id="page">—</b> <span class="muted" id="pagepos"></span></span>
  <button onclick="go(1)">▶</button>
  <span class="muted" id="tag"></span>
  <div class="bar"><div id="prog"></div></div>
  <span class="muted" id="progtext"></span>
  <button onclick="exportGold()">export verified</button>
</header>

<main id="main"></main>

<footer>
  <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
  <span><kbd>Enter</kbd> accept + next</span>
  <span><kbd>⌘</kbd>+<kbd>←</kbd>/<kbd>→</kbd> page</span>
  <span><kbd>⌥</kbd>+<kbd>u</kbd> mark unreadable</span>
  <span><kbd>Esc</kbd> revert to machine text</span>
  <span id="status"></span>
</footer>

<script>
let PAGES = [], IDX = 0, ENTRIES = [], SEL = 0, TAG = null;

const $ = (s) => document.querySelector(s);
const status = (m) => { $('#status').textContent = m;
  clearTimeout(window._t); window._t = setTimeout(() => $('#status').textContent = '', 2000); };

async function boot() {
  const r = await (await fetch('/api/pages')).json();
  PAGES = r.pages; TAG = r.tag;
  $('#doc').textContent = r.document_id;
  $('#tag').textContent = 'ocr: ' + (r.tag || 'default');
  setProgress(r.progress);
  await load(0);
}

function setProgress(p) {
  const pct = p.entries ? (100 * p.reviewed / p.entries) : 0;
  $('#prog').style.width = pct.toFixed(1) + '%';
  $('#progtext').textContent = `${p.reviewed}/${p.entries} (${pct.toFixed(1)}%)`;
}

async function load(i) {
  IDX = Math.max(0, Math.min(PAGES.length - 1, i));
  const page = PAGES[IDX];
  const r = await (await fetch('/api/page?page=' + page)).json();
  ENTRIES = r.entries; SEL = 0;
  $('#page').textContent = page;
  $('#pagepos').textContent = `(${IDX + 1} of ${PAGES.length})`;
  setProgress(r.progress);
  render();
}

function render() {
  const main = $('#main');
  main.innerHTML = '';
  const bands = [...new Set(ENTRIES.map(e => e.band_label))];
  bands.forEach(label => {
    const box = document.createElement('div');
    box.className = 'band';
    box.innerHTML = `<h2>${label} 字第</h2>`;
    const rows = document.createElement('div');
    rows.className = 'rows';
    ENTRIES.forEach((e, i) => {
      if (e.band_label !== label) return;
      // Pre-fill with the human value if one exists, else the machine's. The
      // machine text is kept separately so Esc can restore it.
      const value = e.human != null ? e.human : (e.machine || '');
      const row = document.createElement('div');
      row.className = 'row' + (i === SEL ? ' sel' : '')
        + (e.findings.length ? ' flagged' : '')
        + (e.human != null || e.unreadable ? ' done' : '');
      row.dataset.i = i;
      const findings = e.findings.map(f =>
        `<span class="kind">${f.kind}</span>${f.expected ? ' expected ' + f.expected : ''}`
      ).join(' · ');
      row.innerHTML = `
        <div class="idx">${e.band_label}·${e.entry_index}</div>
        <div class="crop">${e.crop_path
          ? `<img loading="lazy" src="/img?path=${encodeURIComponent(e.crop_path)}">`
          : '<span class="meta">no crop</span>'}</div>
        <div><input type="text" value="${escapeHtml(value)}"
             data-machine="${escapeHtml(e.machine || '')}" data-i="${i}"></div>
        <div class="meta">${e.unreadable ? '<b>unreadable</b><br>' : ''}
             ${findings || (e.machine_backend ? e.machine_backend : '')}</div>`;
      rows.appendChild(row);
    });
    box.appendChild(rows);
    main.appendChild(box);
  });
  main.querySelectorAll('input[type=text]').forEach(inp => {
    inp.addEventListener('input', () => {
      inp.classList.toggle('changed', inp.value !== inp.dataset.machine);
    });
    inp.addEventListener('focus', () => { SEL = +inp.dataset.i; highlight(); });
  });
  focusSel();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight() {
  document.querySelectorAll('.row').forEach(r =>
    r.classList.toggle('sel', +r.dataset.i === SEL));
}

function focusSel() {
  const inp = document.querySelector(`input[data-i="${SEL}"]`);
  if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
             inp.closest('.row').scrollIntoView({block: 'nearest'}); }
  highlight();
}

async function accept(i) {
  const inp = document.querySelector(`input[data-i="${i}"]`);
  if (!inp) return;
  const e = ENTRIES[i];
  await fetch('/api/correction', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      page_index: e.page_index, band_label: e.band_label,
      entry_index: e.entry_index, transcription: inp.value, unreadable: false,
    }),
  }).then(r => r.json()).then(r => { if (r.progress) setProgress(r.progress); });
  e.human = inp.value;
  inp.closest('.row').classList.add('done');
}

async function markUnreadable(i) {
  const e = ENTRIES[i];
  await fetch('/api/correction', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      page_index: e.page_index, band_label: e.band_label,
      entry_index: e.entry_index, transcription: null, unreadable: true,
    }),
  }).then(r => r.json()).then(r => { if (r.progress) setProgress(r.progress); });
  e.unreadable = true;
  status('marked unreadable');
  render();
}

async function exportGold() {
  const r = await (await fetch('/api/export', {method: 'POST'})).json();
  status(`exported ${r.written} verified entries`);
}

function go(d) { load(IDX + d); }

document.addEventListener('keydown', async (ev) => {
  if (ev.metaKey && ev.key === 'ArrowLeft') { ev.preventDefault(); return go(-1); }
  if (ev.metaKey && ev.key === 'ArrowRight') { ev.preventDefault(); return go(1); }
  if (ev.altKey && ev.key.toLowerCase() === 'u') {
    ev.preventDefault(); return markUnreadable(SEL);
  }
  if (ev.key === 'Escape') {
    const inp = document.querySelector(`input[data-i="${SEL}"]`);
    if (inp) { inp.value = inp.dataset.machine; inp.classList.remove('changed'); }
    ev.preventDefault(); return;
  }
  if (ev.key === 'Enter') {
    ev.preventDefault();
    await accept(SEL);
    if (SEL < ENTRIES.length - 1) { SEL++; focusSel(); }
    else { status('page complete'); go(1); }
    return;
  }
  if (ev.key === 'ArrowDown' && SEL < ENTRIES.length - 1) {
    ev.preventDefault(); SEL++; focusSel();
  }
  if (ev.key === 'ArrowUp' && SEL > 0) { ev.preventDefault(); SEL--; focusSel(); }
});

boot();
</script>
</body>
</html>
