[project]
name = "foresight-ocr"
version = "0.1.0"
description = "Provenance-first OCR and structured digitization for Chinese genealogy records"
readme = "PYPI.md"
authors = [{ name = "Runkai Zhang" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
keywords = ["ocr", "genealogy", "traditional-chinese", "digital-humanities"]
import-names = ["foresight_ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    # Pikepdf 10.x CPython 3.12 wheels require macOS 15 on Intel. Keep the
    # supported macOS 14 floor wheel-only on both Apple architectures.
    "pikepdf>=9.11,<10",
    "pillow>=11.0,<13",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10.0.84,<6",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
    "pyyaml>=6.0.1,<7",
    "typer>=0.16,<1",
    "rich>=13.0,<16",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.19,<2",
    "pytest>=8.0",
    "pytest-cov>=7.1,<8",
    "ruff>=0.13,<1",
    "types-pyyaml>=6.0.12,<7",
]
release = [
    "packaging>=24,<27",
    "pyinstaller>=6.21,<7",
    "twine>=7,<8",
]
audit = [
    "bandit>=1.9,<2",
    "pip-audit>=2.9,<3",
]

[project.scripts]
foresight-ocr = "foresight_ocr.cli.main:app"

[project.urls]
Homepage = "https://github.com/runkaiz/foresight-ocr"
Repository = "https://github.com/runkaiz/foresight-ocr"
Issues = "https://github.com/runkaiz/foresight-ocr/issues"

[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foresight_ocr"]
artifacts = ["src/foresight_ocr/review/app.html"]

[tool.hatch.build.targets.wheel.force-include]
"runners/ppocr_v5.py" = "foresight_ocr/backend_runners/ppocr_v5.py"
"runners/paddleocr_vl.py" = "foresight_ocr/backend_runners/paddleocr_vl.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/runners",
    "/scripts",
    "/pyproject.toml",
    "/PUBLICATION.toml",
    "/PYPI.md",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/RELEASING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["foresight_ocr"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE"]
ignore = [
    # Typer deliberately stores Argument/Option descriptors in function defaults.
    "B008",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
