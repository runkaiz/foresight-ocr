<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>familyocr review</title>
<style>
  :root {
    --bg:#14161a; --panel:#1b1e24; --line:#2b3038; --text:#e6e8ec;
    --muted:#8c94a3; --accent:#6ea8fe; --warn:#f0b429; --ok:#4ec9a0; --bad:#f06a6a;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system,"Helvetica Neue",sans-serif; overflow:hidden; }
  header { display:flex; gap:14px; align-items:center; padding:8px 14px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  .muted { color:var(--muted); }
  .bar { flex:1; height:6px; background:var(--line); border-radius:3px; min-width:80px; }
  .bar > div { height:100%; background:var(--ok); border-radius:3px; width:0; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 250px 540px;
         height:calc(100vh - 44px); }
  #sheets { overflow:auto; padding:12px; display:flex; gap:14px; align-items:flex-start;
            background:#0e1013; }
  .sheet { position:relative; flex:0 0 auto; }
  .sheet img { display:block; border:1px solid var(--line); }
  .sheet svg { position:absolute; inset:0; width:100%; height:100%; }
  .sheet .plabel { position:absolute; top:4px; left:6px; background:rgba(0,0,0,.6);
                   padding:2px 8px; border-radius:4px; font-size:12px; }
  rect.box { fill:transparent; stroke-width:3; cursor:pointer; }
  rect.box.b0 { stroke:#4ec9a0; } rect.box.b1 { stroke:#6ea8fe; }
  rect.box.b2 { stroke:#f0b429; } rect.box.b3 { stroke:#c58af9; }
  rect.box.sel { fill:rgba(110,168,254,.22); stroke:#fff; stroke-width:5; }
  rect.box.done { stroke-dasharray:none; fill:rgba(78,201,160,.14); }
  rect.box.flagged { stroke:var(--bad); }
  rect.box.header { stroke:var(--muted); stroke-dasharray:8 6; }
  #list { overflow:auto; border-left:1px solid var(--line); background:var(--bg); }
  .grp { padding:4px 10px; background:var(--panel); font-size:12px;
         position:sticky; top:0; z-index:2; border-bottom:1px solid var(--line); }
  .row { display:grid; grid-template-columns:46px 1.15fr 1.15fr .75fr;
         gap:6px; padding:6px 10px; border-bottom:1px solid var(--line);
         align-items:center; }
  .row.sel { background:#232733; }
  .row.flagged { border-left:3px solid var(--bad); }
  .row.done { border-left:3px solid var(--ok); }
  .row.header { opacity:.55; }
  .idx { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  input[type=text] { width:100%; padding:5px 7px; font-size:17px; background:#0f1115;
                     color:var(--text); border:1px solid var(--line); border-radius:6px; }
  input[type=text]:focus { outline:2px solid var(--accent); border-color:transparent; }
  input.changed { border-color:var(--warn); }
  input.digits { border-color:var(--accent); }
  .meta { grid-column:2 / -1; font-size:11px; color:var(--muted); }
  .meta b { color:var(--bad); }
  .meta .exp { color:var(--warn); }
  /* The crop of the entry being read, in its own column and as large as the
     window allows. An entry is a tall narrow column of glyphs, so height is the
     only dimension that matters — shown inline among the rows it came out about
     30 px wide, which is no help to somebody deciding between 三 and 五. Fixed
     in place rather than moving with the selection, so the eye knows where to
     look. */
  #croppane { display:flex; flex-direction:column; align-items:center; gap:6px;
              padding:8px; background:#0b0d10; border-left:1px solid var(--line);
              overflow:auto; }
  #croppane img { max-height:calc(100vh - 96px); max-width:100%; cursor:zoom-in; }
  #croppane .cap { font-size:11px; color:var(--muted); text-align:center; }
  #croppane .none { color:var(--muted); font-size:12px; margin-top:20px; }
  /* What the recognizer actually returned, when it does not agree with the
     fields. On the harder pages it reads every glyph but scrambles their order
     across lines, and a reviewer who cannot see that has to retype an entry
     whose characters were all present. */
  .raw { grid-column:2 / -1; font-size:12px; color:var(--muted);
         background:#0f1115; border:1px solid var(--line); border-radius:5px;
         padding:3px 6px; white-space:pre-wrap; word-break:break-all; }
  .raw b { color:var(--text); font-weight:600; }
  footer { position:fixed; bottom:0; right:0; padding:4px 12px; background:var(--panel);
           border-top:1px solid var(--line); border-left:1px solid var(--line);
           font-size:11px; color:var(--muted); display:flex; gap:12px; }
  kbd { background:#0f1115; border:1px solid var(--line); border-radius:4px;
        padding:0 4px; color:var(--text); }
  button, select { background:#262b34; color:var(--text); border:1px solid var(--line);
                   border-radius:6px; padding:4px 8px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--accent); }
  #flagcount { color:var(--bad); }
</style>
</head>
<body>
<header>
  <b id="doc">familyocr</b>
  <button onclick="go(-1)">◀</button>
  <span>p<b id="page">—</b> <span class="muted" id="pagepos"></span></span>
  <button onclick="go(1)">▶</button>
  <!-- 201 pages is too many to walk to. The box also keeps the URL in step, so
       a reviewer can close the tab and come back to where they stopped. -->
  <label class="muted">go to p
    <input id="goto" type="number" min="1" style="width:5em"
           onchange="jump(this.value)">
  </label>
  <label class="muted">spread
    <select id="spread" onchange="reload()">
      <option value="1" selected>1</option><option value="2">2</option>
      <option value="3">3</option>
    </select>
  </label>
  <label class="muted">zoom
    <input id="zoom" type="range" min="20" max="100" value="42" oninput="setZoom()">
  </label>
  <span id="flagcount"></span>
  <span class="muted" id="frame"></span>
  <div class="bar"><div id="prog"></div></div>
  <span class="muted" id="progtext"></span>
  <button onclick="exportAll()">export</button>
</header>

<main>
  <div id="sheets"></div>
  <div id="croppane"><span class="none">select an entry</span></div>
  <div id="list"></div>
</main>

<footer>
  <span><kbd>↑</kbd><kbd>↓</kbd> entry</span>
  <span><kbd>⇥</kbd> field</span>
  <span><kbd>⏎</kbd> confirm</span>
  <span><kbd>⌥E</kbd> take expected</span>
  <span><kbd>⌥N</kbd> next flagged</span>
  <span><kbd>⌘←→</kbd> page</span>
  <span><kbd>⌥U</kbd> unreadable</span>
  <span><kbd>Esc</kbd> revert</span>
  <span id="status"></span>
</footer>

<script>
let PAGES=[], SUMMARY=[], IDX=0, SHEETS=[], FLAT=[], SEL=0, TAG=null;
const FIELDS = ['own_id','parent','birth_order'];
const $ = s => document.querySelector(s);
const status = m => { $('#status').textContent = m;
  clearTimeout(window._t); window._t = setTimeout(()=>$('#status').textContent='',2200); };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function boot(){
  const r = await (await fetch('/api/pages')).json();
  PAGES=r.pages; SUMMARY=r.summary||[]; TAG=r.tag;
  $('#doc').textContent=r.document_id;
  setProgress(r.progress);
  const want = +location.hash.replace('#p','');
  if(want){ jump(want); } else { await load(0); }
  addEventListener('hashchange', ()=>{
    const p = +location.hash.replace('#p','');
    if(p && SHEETS[0] && SHEETS[0].page !== p) jump(p);
  });
}
function setProgress(p){
  const pct = p.entries ? 100*p.reviewed/p.entries : 0;
  $('#prog').style.width = pct.toFixed(1)+'%';
  $('#progtext').textContent = `${p.reviewed}/${p.entries}`;
}
function setZoom(){
  const w = $('#zoom').value;
  document.querySelectorAll('.sheet').forEach(s=>s.style.width = w+'vh');
  document.querySelectorAll('.sheet img').forEach(i=>i.style.width='100%');
}

async function load(i){
  IDX = Math.max(0, Math.min(PAGES.length-1, i));
  const span = $('#spread').value;
  const r = await (await fetch(`/api/page?page=${PAGES[IDX]}&spread=${span}`)).json();
  SHEETS = r.pages;
  // One flat list across the spread: a band's sequence continues over the page
  // break, so the reviewer should be able to walk straight through it.
  FLAT = [];
  SHEETS.forEach(s => s.entries.forEach(e => FLAT.push(e)));
  SEL = 0;
  $('#page').textContent = SHEETS.map(s=>s.page).join('–');
  $('#pagepos').textContent = `(${IDX+1}/${PAGES.length})`;
  const flags = FLAT.filter(e=>e.flagged).length;
  $('#flagcount').textContent = flags ? `${flags} disputed` : '';
  if(SHEETS[0]){
    $('#goto').value = SHEETS[0].page;
    // replaceState, not a hash assignment: this is recording where the reviewer
    // is, and it should not fill the back button with every page they passed.
    history.replaceState(null, '', `#p${SHEETS[0].page}`);
  }
  const odd = SHEETS.filter(s=>s.frame_status && s.frame_status!=='automatic');
  $('#frame').textContent = odd.length ? `frame: ${odd.map(s=>s.page+' '+s.frame_status).join(', ')}` : '';
  setProgress(r.progress);
  render();
}
function reload(){ load(IDX); }

function render(){
  const sheets = $('#sheets'); sheets.innerHTML='';
  let flatIdx = 0;
  SHEETS.forEach(s => {
    const div = document.createElement('div');
    div.className='sheet';
    const boxes = s.entries.map(e => {
      const i = flatIdx++;
      if (!e.bbox) return '';
      const [x0,y0,x1,y1] = e.bbox;
      const cls = ['box','b'+(e.band_index%4)];
      if (e.role !== 'entry') cls.push('header');
      if (e.flagged) cls.push('flagged');
      if (e.human!=null || e.unreadable) cls.push('done');
      return `<rect class="${cls.join(' ')}" data-i="${i}" x="${x0}" y="${y0}"
                width="${x1-x0}" height="${y1-y0}"></rect>`;
    }).join('');
    div.innerHTML = `
      <img src="/img?path=${encodeURIComponent(s.image)}" alt="page ${s.page}">
      <svg viewBox="0 0 ${s.width} ${s.height}" preserveAspectRatio="none">${boxes}</svg>
      <span class="plabel">p${s.page}${s.frame_status && s.frame_status!=='automatic'
        ? ' · '+s.frame_status : ''}</span>`;
    sheets.appendChild(div);
  });
  sheets.querySelectorAll('rect.box').forEach(r=>{
    r.addEventListener('click', ()=>{ SEL=+r.dataset.i; focusSel(); });
  });

  const list = $('#list'); list.innerHTML='';
  let idx = 0;
  SHEETS.forEach(s => {
    let lastBand = null;
    s.entries.forEach(e => {
      if (e.band_label !== lastBand) {
        lastBand = e.band_label;
        const h = document.createElement('div');
        h.className='grp';
        h.textContent = `p${s.page} · ${e.band_label} 字第`;
        list.appendChild(h);
      }
      const i = idx++;
      const row = document.createElement('div');
      row.className = 'row'+(i===SEL?' sel':'')+(e.flagged?' flagged':'')
        +((e.human!=null||e.unreadable)?' done':'')+(e.role!=='entry'?' header':'');
      row.dataset.i = i;

      const findings = e.findings.map(x=>`<b>${x.kind}</b>`).join(' ');
      const expected = e.expected_own_id
        ? `<span class="exp">the run wants ${esc(e.expected_own_id)} — ⌥E</span>` : '';
      const leftover = e.leftover
        ? `<span>unplaced: ${esc(e.leftover)}</span>` : '';
      const notes = [
        e.role!=='entry' ? 'header — not a person' : '',
        e.unreadable ? 'unreadable' : '',
        findings, expected, leftover,
      ].filter(Boolean).join(' · ');

      // Show the reading itself whenever the fields do not account for it: the
      // characters are usually all there and only their order is wrong, which
      // is a glance to fix and a retype to miss.
      const composed = FIELDS.map(f=>e[f]||'').join('');
      const flat = (e.machine||'').replace(/\s+/g,' ').trim();
      const showRaw = flat && flat.replace(/\s/g,'') !== composed;

      row.innerHTML = `
        <div class="idx">${e.band_label}·${e.entry_index}</div>
        ${FIELDS.map(f=>`<div><input type="text" data-i="${i}" data-f="${f}"
            value="${esc(e[f])}" placeholder="${f==='own_id'?'own':f==='parent'?'father':'order'}"
            ></div>`).join('')}
        ${notes ? `<div class="meta">${notes}</div>` : ''}
        ${showRaw ? `<div class="raw">read <b>${esc(flat)}</b></div>` : ''}`;
      list.appendChild(row);
    });
  });
  list.querySelectorAll('input[type=text]').forEach(inp=>{
    inp.dataset.orig = inp.value;
    inp.addEventListener('input', ()=>{
      inp.classList.toggle('changed', inp.value!==inp.dataset.orig);
      // Digits are an instruction to write a numeral, not a transcription.
      inp.classList.toggle('digits', /^\d+$/.test(inp.value.trim()));
    });
    inp.addEventListener('focus', ()=>{ SEL=+inp.dataset.i; mark(); });
    inp.addEventListener('blur', ()=> normalize(inp));
  });
  setZoom();
  focusSel();
}

// A reviewer types 343 and means 三百四十三. The conversion lives on the server
// so there is one description of how this book writes numbers — the same one
// the parser reads back.
async function normalize(inp){
  const raw = inp.value.trim();
  if(!/^\d+$/.test(raw)) return;
  const e = FLAT[+inp.dataset.i];
  const label = inp.dataset.f==='own_id' ? e.own_label
              : inp.dataset.f==='parent' ? e.parent_label : null;
  if(!label){ return; }
  const r = await (await fetch(`/api/numeral?label=${encodeURIComponent(label)}&n=${raw}`)).json();
  if(r.text){ inp.value = r.text; inp.classList.remove('digits');
              inp.classList.toggle('changed', inp.value!==inp.dataset.orig); }
}

function mark(){
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel', +r.dataset.i===SEL));
  document.querySelectorAll('rect.box').forEach(r=>r.classList.toggle('sel', +r.dataset.i===SEL));
  showCrop();
}
function showCrop(){
  const e = FLAT[SEL], pane = $('#croppane');
  if(!e){ pane.innerHTML = '<span class="none">select an entry</span>'; return; }
  pane.innerHTML = e.crop_path
    ? `<img src="/img?path=${encodeURIComponent(e.crop_path)}" alt="entry crop"
         onclick="window.open(this.src)">
       <div class="cap">p${e.page_index} · ${e.band_label}·${e.entry_index}
         · click to open full size</div>`
    : '<span class="none">no crop on disk for this entry</span>';
}
function focusSel(field){
  const want = field || 'own_id';
  const inp = document.querySelector(`input[data-i="${SEL}"][data-f="${want}"]`);
  if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
    inp.closest('.row').scrollIntoView({block:'nearest'}); }
  const box = document.querySelector(`rect.box[data-i="${SEL}"]`);
  if(box) box.closest('.sheet').scrollIntoView({block:'nearest', inline:'nearest'});
  mark();
}
function fieldsOf(i){
  const out = {};
  document.querySelectorAll(`input[data-i="${i}"]`).forEach(inp=>{
    out[inp.dataset.f] = inp.value.trim() || null;
  });
  return out;
}

async function accept(i){
  const e = FLAT[i];
  if(!e) return;
  const inp = document.activeElement;
  if(inp && inp.dataset && inp.dataset.i==String(i)) await normalize(inp);
  const fields = fieldsOf(i);
  const r = await (await fetch('/api/correction',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({page_index:e.page_index, band_label:e.band_label,
      entry_index:e.entry_index, fields, unreadable:false})})).json();
  if(r.progress) setProgress(r.progress);
  e.human = r.transcription;
  Object.assign(e, fields);
  const row = document.querySelector(`.row[data-i="${i}"]`);
  if(row) row.classList.add('done');
  const box = document.querySelector(`rect.box[data-i="${i}"]`);
  if(box) box.classList.add('done');
  document.querySelectorAll(`input[data-i="${i}"]`).forEach(x=>{
    x.dataset.orig = x.value; x.classList.remove('changed'); });
}
async function markUnreadable(i){
  const e = FLAT[i];
  const r = await (await fetch('/api/correction',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({page_index:e.page_index, band_label:e.band_label,
      entry_index:e.entry_index, transcription:null, unreadable:true})})).json();
  if(r.progress) setProgress(r.progress);
  e.unreadable = true; status('marked unreadable'); render();
}
function takeExpected(){
  const e = FLAT[SEL];
  if(!e || !e.expected_own_id) { status('nothing expected here'); return; }
  const inp = document.querySelector(`input[data-i="${SEL}"][data-f="own_id"]`);
  if(inp){ inp.value = e.expected_own_id; inp.classList.add('changed');
           inp.focus(); status(`took ${e.expected_own_id}`); }
}
async function exportAll(){
  status('exporting…');
  const r = await (await fetch('/api/export',{method:'POST'})).json();
  status(`${r.entries} entries → ${r.path} (${r.human} by hand)`);
}
function go(d){ load(IDX + d*Math.max(1, +$('#spread').value)); }

// Flagged entries are where the sequence checksum disagrees with the reading.
// Walking to the next one is the difference between reviewing a page and
// hunting through it; past the end of the spread it carries on to the next page
// that has one, so a clean run of pages costs no keystrokes.
function nextFlagged(dir){
  const order = dir>0 ? [...FLAT.keys()] : [...FLAT.keys()].reverse();
  for(const i of order){
    if((dir>0 ? i>SEL : i<SEL) && FLAT[i].flagged){ SEL=i; focusSel(); return; }
  }
  for(let step=1; step<=PAGES.length; step++){
    const j = IDX + dir*step;
    if(j<0 || j>=PAGES.length) break;
    const s = SUMMARY.find(x=>x.page===PAGES[j]);
    if(s && s.flagged){ load(j).then(()=>{
      const k = FLAT.findIndex(e=>e.flagged);
      if(k>=0){ SEL=k; focusSel(); }
      status(`p${PAGES[j]} · ${s.flagged} disputed`);
    }); return; }
  }
  status(dir>0 ? 'no disputed entries ahead' : 'no disputed entries behind');
}

// Page numbers are the book's, not the list's: pages the pipeline skipped leave
// gaps, so jumping to 177 must land on 177 and not on the 177th sheet.
function jump(page){
  const want = +page;
  if(!want) return;
  let best = 0;
  PAGES.forEach((p,i)=>{ if(p<=want) best=i; });
  load(best);
}

document.addEventListener('keydown', async ev=>{
  if(ev.metaKey && ev.key==='ArrowLeft'){ ev.preventDefault(); return go(-1); }
  if(ev.metaKey && ev.key==='ArrowRight'){ ev.preventDefault(); return go(1); }
  if(ev.altKey && ev.key.toLowerCase()==='u'){ ev.preventDefault(); return markUnreadable(SEL); }
  if(ev.altKey && ev.key.toLowerCase()==='e'){ ev.preventDefault(); return takeExpected(); }
  if(ev.altKey && ev.key.toLowerCase()==='n'){ ev.preventDefault(); return nextFlagged(1); }
  if(ev.altKey && ev.key.toLowerCase()==='p'){ ev.preventDefault(); return nextFlagged(-1); }
  if(ev.key==='Escape'){
    document.querySelectorAll(`input[data-i="${SEL}"]`).forEach(i=>{
      i.value=i.dataset.orig; i.classList.remove('changed','digits'); });
    ev.preventDefault(); return;
  }
  if(ev.key==='Enter'){ ev.preventDefault(); await accept(SEL);
    if(SEL<FLAT.length-1){ SEL++; focusSel(); } else { status('spread complete'); go(1); } return; }
  if(ev.key==='ArrowDown' && SEL<FLAT.length-1){ ev.preventDefault(); SEL++; focusSel(); }
  if(ev.key==='ArrowUp' && SEL>0){ ev.preventDefault(); SEL--; focusSel(); }
});
boot();
</script>
</body>
</html>
