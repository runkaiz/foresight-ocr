schema_version = 1
max_worktree_file_bytes = 10000000
max_history_blob_bytes = 10000000

# Store reviewed email addresses as SHA-256 digests of the lowercase address.
# This lets the audit detect a new author identity without copying addresses into
# the public policy file. This list stays empty until the repository owner has
# explicitly approved the identity already present in Git history.
reviewed_author_email_sha256 = []

[[asset_review]]
name = "corpus screenshots"
globs = ["docs/screenshots/*"]
decision = "pending"
license_expression = ""
rights_basis = ""

[[asset_review]]
name = "human-verified genealogy transcriptions"
globs = ["benchmarks/gold/*.tsv"]
decision = "pending"
license_expression = ""
rights_basis = ""

[[asset_review]]
name = "document-specific profiles and learned templates"
globs = ["configs/*.yaml"]
decision = "pending"
license_expression = ""
rights_basis = ""

[[asset_review]]
name = "corpus-derived reports and tutorial"
globs = [
    "docs/corpus-analysis.md",
    "docs/layout-poc-report.md",
    "docs/ocr-benchmark.md",
    "get-started.md",
]
decision = "pending"
license_expression = ""
rights_basis = ""

