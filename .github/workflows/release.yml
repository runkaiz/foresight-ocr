name: Release

on:
  workflow_dispatch:
    inputs:
      signed_test:
        description: Force Apple and Windows signing without publishing
        required: true
        default: false
        type: boolean
      apple_signed_test:
        description: Force Apple signing and follow the Windows release policy
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  signing-preflight:
    name: Validate signing configuration
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      apple_signing_required: ${{ steps.policy.outputs.apple_signing_required }}
      windows_signing_required: ${{ steps.policy.outputs.windows_signing_required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve release signing policy
        id: policy
        shell: bash
        env:
          SIGNED_TEST: ${{ inputs.signed_test == true }}
          APPLE_SIGNED_TEST: ${{ inputs.apple_signed_test == true }}
          REQUIRE_WINDOWS_SIGNING: ${{ vars.REQUIRE_WINDOWS_SIGNING }}
        run: >-
          python3 scripts/release_signing_policy.py
          --github-output "$GITHUB_OUTPUT"
          --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Require selected signing inputs for tags and signed tests
        shell: bash
        env:
          APPLE_SIGNING_REQUIRED: ${{ steps.policy.outputs.apple_signing_required }}
          WINDOWS_SIGNING_REQUIRED: ${{ steps.policy.outputs.windows_signing_required }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          if [[ "$APPLE_SIGNING_REQUIRED" != "true" \
            && "$WINDOWS_SIGNING_REQUIRED" != "true" ]]; then
            echo "Unsigned manual candidate; signing preflight is not required."
            exit 0
          fi

          missing=()
          if [[ "$APPLE_SIGNING_REQUIRED" == "true" ]]; then
            for name in \
              APPLE_DEVELOPER_ID_P12 \
              APPLE_DEVELOPER_ID_PASSWORD \
              APPLE_DEVELOPER_ID_IDENTITY \
              APPLE_NOTARY_ID \
              APPLE_TEAM_ID \
              APPLE_APP_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                missing+=("$name")
              fi
            done
          fi
          if [[ "$WINDOWS_SIGNING_REQUIRED" == "true" ]]; then
            for name in \
              WINDOWS_SIGNING_PFX \
              WINDOWS_SIGNING_PASSWORD \
              WINDOWS_TIMESTAMP_URL; do
              if [[ -z "${!name}" ]]; then
                missing+=("$name")
              fi
            done
          fi
          if (( ${#missing[@]} )); then
            printf 'Missing signed-release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$WINDOWS_SIGNING_REQUIRED" == "true" \
            && "$WINDOWS_TIMESTAMP_URL" != https://* ]]; then
            echo "WINDOWS_TIMESTAMP_URL must be an HTTPS RFC 3161 endpoint." >&2
            exit 1
          fi
          if [[ "$APPLE_SIGNING_REQUIRED" == "true" ]]; then
            printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode >/dev/null
          fi
          if [[ "$WINDOWS_SIGNING_REQUIRED" == "true" ]]; then
            printf '%s' "$WINDOWS_SIGNING_PFX" | base64 --decode >/dev/null
          fi
          if [[ "$WINDOWS_SIGNING_REQUIRED" != "true" ]]; then
            echo "::notice title=Windows artifacts are unsigned::The current release policy does not require Authenticode."
          fi
          echo "Selected signed-release inputs are present and certificate blobs decode."

  package:
    name: Build and verify Python distributions
    needs: signing-preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true
      - name: Install project and release tools
        run: uv sync --frozen --extra dev --extra release --extra audit
      - name: Verify tag and package versions
        run: uv run python scripts/check_version.py
      - name: Verify wheels for every supported platform
        run: uv run python scripts/check_platform_wheels.py
      - name: Run static quality and security checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/foresight_ocr
          uv run mypy --platform win32 src/foresight_ocr
          uv run bandit -q -ll -r src/foresight_ocr scripts runners -x tests
      - name: Audit public tree, history, secrets, and publication decisions
        shell: bash
        env:
          PUBLICATION_AUDIT_REQUIRED: ${{ github.ref_type == 'tag' || inputs.signed_test == true || inputs.apple_signed_test == true }}
        run: |
          if [[ "$PUBLICATION_AUDIT_REQUIRED" == "true" ]]; then
            uv run python scripts/audit_public_release.py
          else
            uv run python scripts/audit_public_release.py --technical-only
          fi
          uv run python scripts/audit_secrets.py
      - name: Run the full test suite
        run: uv run pytest -q --cov=foresight_ocr --cov-branch --cov-report=term-missing
      - name: Audit locked dependencies
        run: uv run pip-audit
      - name: Build and inspect distributions
        run: |
          uv build
          uv run twine check dist/foresight_ocr-*.whl dist/foresight_ocr-*.tar.gz
          uv run python scripts/verify_release_artifacts.py
      - name: Smoke-test an isolated wheel install
        shell: bash
        run: |
          smoke_dir=$(mktemp -d)
          uv venv --python 3.12 "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          uv run python scripts/smoke_cli_distribution.py \
            "$smoke_dir/venv/bin/foresight-ocr"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  binaries:
    name: Build standalone (${{ matrix.target }})
    needs: signing-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            artifacts: |
              dist/foresight-ocr-*-linux-x86_64.tar.gz
              dist/foresight-ocr-*-linux-x86_64.AppImage
              dist/foresight-ocr_*_amd64.deb
              dist/foresight-ocr-*.x86_64.rpm
          - os: ubuntu-22.04-arm
            target: linux-arm64
            artifacts: |
              dist/foresight-ocr-*-linux-arm64.tar.gz
              dist/foresight-ocr-*-linux-arm64.AppImage
              dist/foresight-ocr_*_arm64.deb
              dist/foresight-ocr-*.aarch64.rpm
          - os: windows-2022
            target: windows-x86_64
            artifacts: |
              dist/foresight-ocr-*-windows-x86_64.zip
              dist/foresight-ocr-*-windows-x86_64.msi
              dist/foresight-ocr-*-windows-x86_64-signing.json
          - os: macos-15-intel
            target: macos-x86_64
            artifacts: "dist/foresight-ocr-*-macos-x86_64.tar.gz"
          - os: macos-15
            target: macos-arm64
            artifacts: "dist/foresight-ocr-*-macos-arm64.tar.gz"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true
      - name: Install Linux package tools
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes cpio desktop-file-utils rpm
      - name: Install WiX Toolset
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $toolDir wix --version 5.0.2
          $toolDir >> $env:GITHUB_PATH
      - name: Install standalone build dependencies
        run: uv sync --frozen --extra release
      - name: Verify package version
        run: uv run python scripts/check_version.py
      - name: Import Apple Developer ID certificate
        if: >-
          startsWith(matrix.target, 'macos-') &&
          needs.signing-preflight.outputs.apple_signing_required == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          if [[ -z "$APPLE_DEVELOPER_ID_P12" ]]; then
            exit 0
          fi
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/foresight-signing.keychain-db"
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | \
            openssl base64 -d -A -out "$certificate"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$certificate" -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Prepare Windows Authenticode certificate
        if: >-
          startsWith(matrix.target, 'windows-') &&
          needs.signing-preflight.outputs.windows_signing_required == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX) { exit 0 }
          $certificate = Join-Path $env:RUNNER_TEMP "foresight-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "Windows SDK signtool.exe was not found" }
          "FORESIGHT_WINDOWS_CERTIFICATE=$certificate" >> $env:GITHUB_ENV
          "FORESIGHT_SIGNTOOL=$($signTool.FullName)" >> $env:GITHUB_ENV
      - name: Build, smoke-test, and archive standalone CLI
        env:
          FORESIGHT_MACOS_SIGNING_IDENTITY: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
          FORESIGHT_APPLE_ID: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_NOTARY_ID || '' }}
          FORESIGHT_APPLE_TEAM_ID: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_TEAM_ID || '' }}
          FORESIGHT_APPLE_APP_PASSWORD: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
          FORESIGHT_WINDOWS_CERTIFICATE_PASSWORD: ${{ needs.signing-preflight.outputs.windows_signing_required == 'true' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          FORESIGHT_WINDOWS_TIMESTAMP_URL: ${{ needs.signing-preflight.outputs.windows_signing_required == 'true' && vars.WINDOWS_TIMESTAMP_URL || '' }}
          FORESIGHT_REQUIRE_SIGNING: ${{ ((startsWith(matrix.target, 'macos-') && needs.signing-preflight.outputs.apple_signing_required == 'true') || (startsWith(matrix.target, 'windows-') && needs.signing-preflight.outputs.windows_signing_required == 'true')) && '1' || '0' }}
        run: uv run python scripts/build_binary.py --target ${{ matrix.target }}
      - name: Build and smoke-test Linux packages
        if: startsWith(matrix.target, 'linux-')
        run: uv run python scripts/build_linux_packages.py --target ${{ matrix.target }}
      - name: Install-test the Debian package
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get install --yes ./dist/foresight-ocr_*.deb
          /usr/bin/foresight-ocr --version
          /usr/bin/foresight-ocr doctor
      - name: Build, validate, optionally sign, and smoke-test Windows MSI
        if: startsWith(matrix.target, 'windows-')
        env:
          FORESIGHT_WINDOWS_CERTIFICATE_PASSWORD: ${{ needs.signing-preflight.outputs.windows_signing_required == 'true' && secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          FORESIGHT_WINDOWS_TIMESTAMP_URL: ${{ needs.signing-preflight.outputs.windows_signing_required == 'true' && vars.WINDOWS_TIMESTAMP_URL || '' }}
          FORESIGHT_REQUIRE_SIGNING: ${{ needs.signing-preflight.outputs.windows_signing_required == 'true' && '1' || '0' }}
        run: uv run python scripts/build_windows_installer.py
      - name: Install-test the Windows MSI
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $msi = (Get-Item "dist/foresight-ocr-*-windows-x86_64.msi").FullName
          $installLog = Join-Path $env:RUNNER_TEMP "foresight-msi-install.log"
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$msi`"", "/qn", "/norestart", "/l*v", "`"$installLog`""
          )
          if ($install.ExitCode -notin 0, 3010) {
            Get-Content $installLog
            throw "MSI install failed with exit code $($install.ExitCode)"
          }
          $executable = Join-Path $env:ProgramFiles "Foresight OCR\foresight-ocr.exe"
          & $executable --version
          & $executable doctor
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if ($machinePath -notlike "*Foresight OCR*") {
            throw "MSI did not add Foresight OCR to the machine PATH"
          }
          $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/x", "`"$msi`"", "/qn", "/norestart"
          )
          if ($uninstall.ExitCode -notin 0, 3010) {
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  native-macos:
    name: Build native macOS application DMG
    needs: [signing-preflight, binaries]
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: false
      - name: Run native application tests
        run: clients/macos/scripts/test.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-arm64
          path: native-backend
      - name: Stage the standalone backend
        shell: bash
        run: |
          mkdir -p build/release
          tar -xzf native-backend/foresight-ocr-*-macos-arm64.tar.gz \
            -C build/release
      - name: Import Apple Developer ID certificate
        if: needs.signing-preflight.outputs.apple_signing_required == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          if [[ -z "$APPLE_DEVELOPER_ID_P12" ]]; then
            exit 0
          fi
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/foresight-app-signing.keychain-db"
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | \
            openssl base64 -d -A -out "$certificate"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$certificate" -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Build, sign, and package the native application
        shell: bash
        env:
          SIGN_IDENTITY: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
          FORESIGHT_APPLE_ID: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_NOTARY_ID || '' }}
          FORESIGHT_APPLE_TEAM_ID: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_TEAM_ID || '' }}
          FORESIGHT_APPLE_APP_PASSWORD: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && secrets.APPLE_APP_PASSWORD || '' }}
          FORESIGHT_REQUIRE_SIGNING: ${{ needs.signing-preflight.outputs.apple_signing_required == 'true' && '1' || '0' }}
        run: |
          if [[ "$FORESIGHT_REQUIRE_SIGNING" == "1" ]]; then
            CONFIGURATION=release CREATE_DMG=1 NOTARIZE=1 \
              UV_EXECUTABLE="$(command -v uv)" \
              clients/macos/scripts/build-app.sh
          elif [[ -n "$SIGN_IDENTITY" ]]; then
            notarize=0
            if [[ -n "$FORESIGHT_APPLE_ID" \
              && -n "$FORESIGHT_APPLE_TEAM_ID" \
              && -n "$FORESIGHT_APPLE_APP_PASSWORD" ]]; then
              notarize=1
            fi
            CONFIGURATION=release CREATE_DMG=1 NOTARIZE="$notarize" \
              UV_EXECUTABLE="$(command -v uv)" \
              clients/macos/scripts/build-app.sh
          else
            CONFIGURATION=debug CREATE_DMG=1 \
              UV_EXECUTABLE="$(command -v uv)" \
              clients/macos/scripts/build-app.sh
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-native-macos
          path: clients/macos/dist/*.dmg
          if-no-files-found: error

  release-assets:
    name: Attest and publish GitHub release assets
    needs: [signing-preflight, package, binaries, native-macos]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "release-*"
          path: dist
          merge-multiple: true
      - name: Build the AUR repository bundle
        run: >-
          uv run --no-project --python 3.12
          scripts/build_aur_package.py
          dist/foresight-ocr-*-linux-x86_64.tar.gz
          dist/foresight-ocr-*-linux-arm64.tar.gz
      - name: Verify the complete release set
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'foresight_ocr-*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-*-linux-*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-*-linux-*.AppImage' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr_*.deb' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-*.rpm' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-bin-*-aur.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-*-macos-*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -type f -name 'Foresight-OCR-*-macos-arm64.dmg' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-*-windows-*.zip' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-*-windows-*.msi' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'foresight-ocr-*-windows-*-signing.json' | wc -l)" -eq 1
          cd dist
          sha256sum -- ./* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Verify Windows signing disclosure
        env:
          EXPECTED_WINDOWS_SIGNING: ${{ needs.signing-preflight.outputs.windows_signing_required == 'true' && 'signed' || 'unsigned' }}
        run: >-
          uv run --no-project --python 3.12
          scripts/verify_windows_signing_status.py
          --expected "$EXPECTED_WINDOWS_SIGNING"
          dist/foresight-ocr-*-windows-x86_64-signing.json
      - name: Verify every standalone archive
        run: >-
          uv run --no-project --python 3.12
          scripts/verify_standalone_archive.py
          dist/foresight-ocr-*-linux-*.tar.gz
          dist/foresight-ocr-*-macos-*.tar.gz
          dist/foresight-ocr-*-windows-*.zip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complete-release
          path: dist/
          if-no-files-found: error
      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --title "Foresight OCR $GITHUB_REF_NAME"
          fi

  publish-pypi:
    name: Publish Python distributions to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, release-assets]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/foresight-ocr
    permissions:
